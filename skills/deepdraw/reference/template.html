.dd-root[data-mode="view"] .dd-drillable { cursor: zoom-in; }
.dd-peek { pointer-events: none; }
/* Everything below is drawn inside the filtered SVG, so it uses the
   pre-compensated canvas tokens rather than the chrome's own. */
.dd-selected-outline { fill: none; stroke: var(--dd-canvas-accent); stroke-width: 1.5; stroke-dasharray: 4 3; pointer-events: none; vector-effect: non-scaling-stroke; }
/* The dots are drawn small at every screen size; an invisible dd-handle-hit
   sibling carries the press, so a finger gets a target it can hit without the
   handles themselves looking bloated on a phone. */
.dd-handle { fill: var(--dd-canvas-handle); stroke: var(--dd-canvas-accent); stroke-width: 1.5; pointer-events: none; }
.dd-arrow-handle { fill: var(--dd-canvas-handle); stroke: var(--dd-canvas-accent); stroke-width: 1.5; pointer-events: none; }
.dd-handle-hit { fill: transparent; stroke: none; }
/* The four buttons that spring an arrow out of a selected shape: a fat arrow
   each, and nothing behind it. Dimmed hard on purpose \u2014 they hang in the empty
   canvas around the shape, where anything solid reads as part of the drawing,
   and four of them at once is a lot of furniture for a shortcut. A filled
   silhouette stays readable at an opacity an outlined one would vanish at,
   which is why they lost the ring they used to sit in. They come up to full
   strength under the pointer, the only moment their being a control matters.
   The hover is read off the invisible hit disc rather than off the arrow,
   through the adjacent-sibling selector below: the disc is the whole target,
   and a hover that only counted on the glyph is one nobody would land. */
.dd-connect-glyph {
  fill: var(--dd-canvas-accent); fill-opacity: .3; stroke: none;
  pointer-events: none; transition: fill-opacity 120ms ease;
}
.dd-handle-hit[data-connect]:hover + .dd-connect-glyph { fill-opacity: 1; }
/* The two corner buttons \u2014 turn this shape, draw inside it \u2014 are the same two
   layers as a connector and read the same way, but they are not dimmed: each is
   a distinct action rather than one of four alike, and one of them is the way
   into the level this whole app is about. */
.dd-corner-glyph { fill: var(--dd-canvas-accent); stroke: none; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .dd-connect-glyph { transition: none; }
}
.dd-marquee { fill: var(--dd-canvas-accent); fill-opacity: .08; stroke: var(--dd-canvas-accent); stroke-width: 1; stroke-dasharray: 4 3; pointer-events: none; }
.dd-hover-outline { fill: none; stroke: var(--dd-canvas-accent); stroke-width: 1; stroke-opacity: .5; pointer-events: none; }
/* What somebody else is holding. Solid where your own selection is dashed, so
   the two are told apart at a glance rather than by colour alone, and painted
   from the presence's own colour (set per element) rather than a token \u2014 that
   colour is what makes two collaborators two people. */
.dd-remote-selection { fill: none; stroke-width: 2; stroke-opacity: .9; pointer-events: none; vector-effect: non-scaling-stroke; }
/* Where an arrow end would attach while one is being dragged: a hollow dot on
   the middle of each edge (the sticky places), and a filled one on the point a
   drop would land on. Canvas tokens, not --dd-accent: these are drawn inside
   the filtered SVG. */
.dd-bind-hint { fill: var(--dd-canvas-handle); stroke: var(--dd-canvas-accent); stroke-opacity: .7; pointer-events: none; }
.dd-bind-anchor { fill: var(--dd-canvas-accent); stroke: none; pointer-events: none; }
.dd-cursor-label { font-size: 11px; paint-order: stroke; stroke: var(--dd-canvas-handle); stroke-width: 3px; stroke-linejoin: round; }

.dd-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; height: 100%; padding: 16px; text-align: center; color: var(--dd-muted); font-size: 13px;
}

/* ---------- floating dialogs ---------- */
.dd-popover {
  position: absolute; z-index: 40;
  display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  max-width: min(560px, calc(100% - 16px));
  padding: 6px; background: var(--dd-bg);
  border: 1px solid var(--dd-border-strong); border-radius: var(--dd-radius);
  box-shadow: var(--dd-shadow);
}
.dd-popover-form { flex-direction: column; align-items: stretch; gap: 6px; width: 260px; }
.dd-popover-row { display: flex; align-items: center; gap: 6px; }
/* The input has to be allowed to shrink, or its default intrinsic width keeps
   the row wider than the popover and the button hangs off the edge. */
.dd-popover-row .dd-input { flex: 1; min-width: 0; }
.dd-popover-or {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--dd-muted); text-transform: uppercase; letter-spacing: 0.06em;
}
.dd-popover-or::before, .dd-popover-or::after {
  content: ''; flex: 1; height: 1px; background: var(--dd-border);
}
/* Fixed to the canvas's right edge, vertically centred, rather than tracking
   the selection. The panels are the same width so they stack into one clean
   column. On a phone it collapses to the buttons that reveal them. */
.dd-shape-toolbar {
  position: absolute; z-index: 40;
  top: 50%; right: 10px; left: auto; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: stretch; gap: 8px;
  /* No scroll container: the pickers inside open as absolutely-positioned
     dropdowns, and an overflow of auto here would clip them to the toolbar. */
}
/* On a phone the buttons lie in a row along the bottom of the corner, which is
   the shape of the space that is left over there \u2014 a column of them would run
   up the side of a canvas that is already short. */
.dd-shape-toolbar.dd-shape-toolbar-compact {
  flex-direction: row; align-items: center; gap: 4px; padding: 6px; flex-wrap: nowrap;
}
/* Styling a shape and doing something to it are different kinds of press, so
   the two groups are set apart rather than run together into one long row of
   identical icons. */
.dd-strip-actions { display: flex; align-items: center; gap: 4px; margin-left: 10px; }
/* An action, said in words on a canvas with room for them. Pinned to the panel
   width rather than left to its own content, so the buttons line up as one
   column \u2014 a button eight pixels wider than its neighbour reads as a mistake. */
.dd-action-btn {
  width: 100%;
  justify-content: flex-start; gap: 5px; height: 30px; padding: 0 5px;
  font-size: 12px; font-weight: 600; color: var(--dd-accent);
}
.dd-action-btn svg { flex: 0 0 16px; }
.dd-action-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-action-btn:hover:not(:disabled) { background: var(--dd-accent-soft); border-color: var(--dd-accent); }
.dd-action-btn.dd-btn-danger:hover:not(:disabled) {
  background: var(--dd-danger-soft); border-color: var(--dd-danger);
}
/* Delete is set off from the two that make something rather than remove it \u2014
   white space, so it is not a stray click away from "Open inside". */
.dd-actions-menu .dd-btn-danger { margin-top: 10px; }
/* On mobile the canvas is short, so a vertically centred toolbar sits over
   the drawing; anchor it to the bottom-right corner instead. The zoom controls
   are hidden there and they are in the other corner anyway, so nothing
   collides. */
.dd-root[data-size="mobile"] .dd-shape-toolbar {
  top: auto; bottom: 10px; transform: none;
}
.dd-textarea {
  width: 100%; min-height: 64px; padding: 6px 8px; resize: vertical;
  font: inherit; font-size: 13px; color: var(--dd-text);
  border: 1px solid var(--dd-border); border-radius: 6px; background: var(--dd-bg);
}
.dd-popover-actions { display: flex; justify-content: flex-end; gap: 6px; }

/* Overlaid directly on a shape's label, in place of a floating dialog. Sizing
   is driven from JS (width/height/position track the shape and its content);
   this only supplies the chrome.

   What it shows is the shape's own text colour, a colour out of the document \u2014
   so it belongs to the canvas's colour space, not the app's, and goes through
   --dd-canvas-filter like the drawing does. Painting it with --dd-bg instead
   left a dark theme writing a near-black label on a near-black panel. Its own
   chrome is therefore written the way the selection chrome inside the SVG is:
   the ground is the white the canvas shows, and the border is
   --dd-canvas-accent, the blue that comes back out blue. */
.dd-inline-editor {
  position: absolute; z-index: 40; box-sizing: border-box; margin: 0;
  resize: none; overflow: hidden; white-space: pre-wrap;
  border: 1px solid var(--dd-canvas-accent); border-radius: 4px;
  background: #ffffff; box-shadow: 0 0 0 3px #dbeafe;
  filter: var(--dd-canvas-filter);
}
.dd-inline-editor:focus { outline: none; }

/* ---------- style panels (text / shape) ---------- */
/* Both panels are the same width so they stack into one column on the canvas
   edge; on a phone the same markup is floated as a flyout instead. */
.dd-style-panel {
  display: flex; flex-direction: column; gap: 4px;
  width: var(--dd-style-panel-w); padding: 5px;
  background: var(--dd-bg);
  border: 1px solid var(--dd-border-strong); border-radius: var(--dd-radius);
  box-shadow: var(--dd-shadow);
}
.dd-style-panel-float { position: absolute; z-index: 40; }
.dd-style-panel-title {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--dd-muted); padding: 0 2px 2px;
}
.dd-style-panel-row { display: flex; align-items: center; gap: 4px; }
.dd-style-panel-row > * { flex: 1 1 0; min-width: 0; }
.dd-style-panel-row .dd-icon-select > .dd-btn,
.dd-style-panel-row > .dd-btn, .dd-style-panel-row > .dd-select { width: 100%; }
.dd-style-panel-row .dd-select { padding: 0 2px; }
/* White space, not rules, separates styling from arranging. */
.dd-style-panel-row-apart { margin-top: 10px; }
.dd-btn-danger { color: var(--dd-danger); }
.dd-btn-danger:hover:not(:disabled) { background: var(--dd-danger-soft); border-color: var(--dd-danger); }

.dd-icon-select { position: relative; display: inline-flex; }
.dd-icon-select-menu {
  position: absolute; top: 100%; right: 0; margin-top: 4px; z-index: 45;
  display: flex; flex-direction: column; gap: 2px; padding: 4px;
  background: var(--dd-bg); border: 1px solid var(--dd-border-strong); border-radius: var(--dd-radius);
  box-shadow: var(--dd-shadow);
}
/* The icon's own bar carries the colour, so the button is a plain icon button. */
.dd-color-icon-btn svg { width: 18px; height: 18px; }

/* ---------- markdown pane ---------- */
/* The name of whatever these notes belong to, above them rather than crammed
   into the banner's uppercase small print. It is a field at rest as well as
   under the pointer \u2014 a title you can type over is worth more than one that
   has to be discovered \u2014 but a quiet one, so it reads as a heading until it is
   used. Read-only (view mode, or a reader's page) it is the heading and
   nothing else. */
.dd-md-title {
  flex: 0 0 auto;
  width: 100%; box-sizing: border-box;
  padding: 8px 14px; margin: 0;
  border: 0; border-bottom: 1px solid var(--dd-border);
  border-radius: 0; outline: none;
  background: var(--dd-bg); color: var(--dd-text);
  font: inherit; font-size: 17px; font-weight: 600;
  text-overflow: ellipsis;
}
.dd-md-title::placeholder { color: var(--dd-muted); font-weight: 500; }
.dd-md-title:not([readonly]):hover { background: var(--dd-panel); }
.dd-md-title:focus { background: var(--dd-bg); box-shadow: inset 0 -2px 0 var(--dd-accent); }
.dd-md-title[readonly] { cursor: default; }

/* Whether these notes are still the original's, on a shape that is one more
   appearance of something else. Under the notes, not over them: it says
   something *about* the text above it, and a pane opened to read must not lead
   with a caveat. Quiet \u2014 small, muted, a hairline off the notes \u2014 because it is
   read once per shape and then stops being news; the button is the only part of
   it that has to catch the eye, and only when there is something to press. */
.dd-md-sync {
  flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  padding: 6px 10px;
  border-top: 1px solid var(--dd-border);
  background: var(--dd-panel);
  font-size: 11px; line-height: 1.35; color: var(--dd-muted);
}
.dd-md-sync[hidden] { display: none; }
.dd-md-sync-icon { display: flex; flex: 0 0 auto; }
.dd-md-sync-icon svg { width: 13px; height: 13px; }
/* Straight after the sentence, not pushed to the row's right edge. The pane is
   the rightmost column and this is its last line, so the far corner is where a
   host puts its own furniture \u2014 deepdraw.app's connection pill is fixed exactly
   there \u2014 and a button parked in it is a button under something else. */
.dd-md-sync-release {
  flex: 0 0 auto; padding: 2px 8px;
  font: inherit; font-weight: 600;
  color: var(--dd-text); background: var(--dd-bg);
  border: 1px solid var(--dd-border-strong); border-radius: 5px; cursor: pointer;
}
.dd-md-sync-release:hover { border-color: var(--dd-accent); color: var(--dd-accent); }
/* Released, it is a label and nothing else \u2014 no border to suggest a way back. */
.dd-md-sync-released { color: var(--dd-muted); }

/* Whose notes these are, when they are not the drawing's. A row of its own
   above the name rather than a word beside it: it is the pane's answer to a
   question asked somewhere else entirely \u2014 on the canvas, half a screen away \u2014
   and it has to be readable without being looked for. */
.dd-md-scope {
  flex: 0 0 auto; display: flex; align-items: center;
  padding: 4px 8px;
  border-bottom: 1px solid var(--dd-border);
  background: var(--dd-panel);
}
.dd-md-scope-back {
  display: flex; align-items: center; gap: 4px; min-width: 0;
  padding: 2px 6px; border: 0; border-radius: 5px;
  background: none; color: var(--dd-muted);
  font: inherit; font-size: 12px; cursor: pointer;
}
.dd-md-scope-back:hover { background: var(--dd-bg); color: var(--dd-text); }
.dd-md-scope-back svg { width: 16px; height: 16px; fill: currentColor; flex: 0 0 auto; }
.dd-md-scope-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The pane changing under you, said out loud. The notes swap in answer to a
   click on the canvas, so a pane that merely held different words afterwards
   would be one nobody noticed had answered \u2014 the corner of an eye reads
   movement and reads nothing else. The ring fades over the whole pane; the
   name and the notes come up from under it. */
.dd-md-swap { animation: dd-md-swap-ring 700ms ease-out; }
.dd-md-swap .dd-md-title,
.dd-md-swap .dd-md-scope,
.dd-md-swap > .dd-pane-body { animation: dd-md-swap-in 220ms ease-out; }
@keyframes dd-md-swap-ring {
  from { border-color: var(--dd-accent); box-shadow: 0 0 0 3px var(--dd-accent-soft); }
}
@keyframes dd-md-swap-in {
  from { opacity: 0; transform: translateY(5px); }
}
@media (prefers-reduced-motion: reduce) {
  .dd-md-swap,
  .dd-md-swap .dd-md-title,
  .dd-md-swap .dd-md-scope,
  .dd-md-swap > .dd-pane-body { animation: none; }
}

/* Notes are prose, and prose is read at a reading size \u2014 a point up on the
   14px the rest of the chrome is set in, since the chrome is scanned and this
   is not. The editor keeps its monospace face and matches it. */
.dd-md-editor {
  /* Block, not the inline-block a textarea is by default: as an inline box it
     sits on a baseline, and the descender under it is five pixels the pane
     body cannot fit \u2014 enough for a second scrollbar beside the textarea's own,
     scrolling nothing anybody wanted to scroll. */
  display: block;
  width: 100%; box-sizing: border-box; padding: 4px 16px;
  border: 0; resize: none; outline: none; overflow: hidden;
  background: var(--dd-accent-soft);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; line-height: 1.7;
  color: var(--dd-text);
}

/* ---------- notes, written where they are read ----------
   Every block is rendered except the one the caret is in, which shows its own
   source. So writing and reading are the same screen, and the note in front of
   you while you write it is the note everyone else will see. */
.dd-md-live { display: flex; flex-direction: column; min-height: 100%; padding: 8px 0; }
/* A block is usually one line of prose, so its padding is what stands between
   a note and a list of widely spaced lines: enough for the hover to read as a
   target, not enough to double the leading. */
.dd-md-block {
  padding: 1px 16px; font-size: 15px; line-height: 1.7;
  border-radius: 4px; cursor: text;
}
.dd-md-block:hover { background: var(--dd-panel); }
.dd-md-block > *:first-child { margin-top: 0; }
.dd-md-block > *:last-child { margin-bottom: 0; }
.dd-md-block h1 { font-size: 22px; } .dd-md-block h2 { font-size: 18px; } .dd-md-block h3 { font-size: 16px; }
.dd-md-block h1, .dd-md-block h2, .dd-md-block h3 { margin: .6em 0 .3em; }
.dd-md-block p, .dd-md-block ul, .dd-md-block ol, .dd-md-block pre, .dd-md-block blockquote { margin: 0 0 .4em; }
.dd-md-block code { background: var(--dd-panel); padding: 1px 4px; border-radius: 4px; font-size: 13.5px; }
.dd-md-block pre { background: var(--dd-panel); padding: 10px 12px; border-radius: 6px; overflow: auto; }
.dd-md-block pre code { background: none; padding: 0; }
.dd-md-block blockquote { border-left: 3px solid var(--dd-border-strong); padding-left: 10px; color: var(--dd-muted); }
.dd-md-block table { border-collapse: collapse; }
.dd-md-block th, .dd-md-block td { border: 1px solid var(--dd-border); padding: 4px 8px; }
.dd-md-block img { max-width: 100%; }
.dd-md-placeholder { color: var(--dd-muted); }
/* The empty space under the last block is still the note: clicking it puts the
   caret at the end, rather than being the one part of a short note that does
   nothing. */
.dd-md-rest { flex: 1 1 auto; min-height: 40px; cursor: text; }

/* The cheatsheet, hung under the question mark in the banner. */
.dd-md-help-btn {
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; padding: 0; flex: 0 0 auto;
  border: 0; border-radius: 5px; background: none;
  color: var(--dd-muted); cursor: pointer;
}
.dd-md-help-btn:hover, .dd-md-help-btn[aria-expanded="true"] { background: var(--dd-bg); color: var(--dd-text); }
.dd-md-help-btn svg { width: 16px; height: 16px; fill: currentColor; }
.dd-md-help {
  position: absolute; z-index: 60; top: 34px; right: 8px; left: 8px;
  max-height: calc(100% - 46px); overflow: auto;
  padding: 10px 12px;
  background: var(--dd-bg); border: 1px solid var(--dd-border-strong);
  border-radius: 8px; box-shadow: var(--dd-shadow);
  font-size: 12.5px; color: var(--dd-text);
}
.dd-md-help-heading {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
  color: var(--dd-muted); margin: 8px 0 4px;
}
.dd-md-help-heading:first-child { margin-top: 0; }
.dd-md-help-list {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0;
}
.dd-md-help-list dt { margin: 0; }
.dd-md-help-list dd { margin: 0; color: var(--dd-muted); }
.dd-md-help-list code {
  background: var(--dd-panel); padding: 1px 5px; border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
  white-space: nowrap;
}
.dd-md-view { padding: 12px 16px; font-size: 15px; line-height: 1.7; }
.dd-md-view > *:first-child { margin-top: 0; }
.dd-md-view > *:last-child { margin-bottom: 0; }
.dd-md-view h1 { font-size: 22px; } .dd-md-view h2 { font-size: 18px; } .dd-md-view h3 { font-size: 16px; }
.dd-md-view h1, .dd-md-view h2, .dd-md-view h3 { margin: 1em 0 .4em; }
.dd-md-view p, .dd-md-view ul, .dd-md-view ol, .dd-md-view pre, .dd-md-view blockquote { margin: 0 0 .8em; }
.dd-md-view code { background: var(--dd-panel); padding: 1px 4px; border-radius: 4px; font-size: 13.5px; }
.dd-md-view pre { background: var(--dd-panel); padding: 10px 12px; border-radius: 6px; overflow: auto; }
.dd-md-view pre code { background: none; padding: 0; }
.dd-md-view blockquote { border-left: 3px solid var(--dd-border-strong); padding-left: 10px; color: var(--dd-muted); }
.dd-md-view table { border-collapse: collapse; }
.dd-md-view th, .dd-md-view td { border: 1px solid var(--dd-border); padding: 4px 8px; }
.dd-md-view img { max-width: 100%; }
/* Hosts that ship a CSS reset \u2014 this app's own, through basecoat's Tailwind \u2014
   strip the markers off a list, and a bullet list with no bullets is three
   sentences in a row. Notes are prose, so the browser's own defaults are put
   back for the one place prose is rendered. */
.dd-md-view ul, .dd-md-block ul { list-style: disc; padding-left: 1.4em; }
.dd-md-view ol, .dd-md-block ol { list-style: decimal; padding-left: 1.6em; }
.dd-md-view li, .dd-md-block li { margin: 0; }
.dd-md-view li > p, .dd-md-block li > p { margin: 0; }
/* A task list is a list of checkboxes, not of bullets beside checkboxes. */
.dd-md-view li:has(> input[type="checkbox"]),
.dd-md-block li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.4em; }
.dd-md-ref {
  color: var(--dd-accent); background: var(--dd-accent-soft);
  padding: 0 5px; border-radius: 4px; cursor: pointer; font-weight: 500;
}
.dd-md-lock { font-size: 11px; color: var(--dd-danger); text-transform: none; letter-spacing: 0; }

/* @-mention autocomplete */
.dd-mention {
  position: absolute; z-index: 50; min-width: 200px; max-height: 200px; overflow: auto;
  background: var(--dd-bg); border: 1px solid var(--dd-border-strong);
  border-radius: 6px; box-shadow: var(--dd-shadow); padding: 4px;
}
.dd-mention-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 5px 8px; border: 0; border-radius: 4px; background: none;
  font: inherit; font-size: 13px; text-align: left; color: var(--dd-text); cursor: pointer;
}
.dd-mention-item:hover, .dd-mention-item.dd-active { background: var(--dd-accent-soft); }
.dd-mention-hint { color: var(--dd-muted); font-size: 11px; margin-left: auto; }

/* ---------- tree ---------- */
.dd-tree { padding: 4px; user-select: none; }
.dd-tree-row {
  display: flex; align-items: center; gap: 2px; width: 100%;
  padding: 3px 4px; border: 0; border-radius: 5px; background: none;
  font: inherit; font-size: 13px; color: var(--dd-text); text-align: left; cursor: pointer;
}
.dd-tree-row:hover { background: var(--dd-panel); }
.dd-tree-row.dd-current { background: var(--dd-accent-soft); color: var(--dd-accent); font-weight: 600; }
.dd-tree-row.dd-selected { outline: 1px solid var(--dd-accent); }
.dd-tree-twisty {
  flex: 0 0 16px; width: 16px; height: 16px; display: inline-flex;
  align-items: center; justify-content: center; border: 0; background: none;
  color: var(--dd-muted); cursor: pointer; font-size: 10px; padding: 0;
}
.dd-tree-twisty.dd-leaf { visibility: hidden; }
.dd-tree-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-tree-badge {
  margin-left: auto; font-size: 10px; padding: 1px 5px; border-radius: 999px;
  background: var(--dd-accent); color: var(--dd-on-accent); font-weight: 600;
}

/* ---------- icon picker ---------- */
.dd-icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; max-height: 220px; overflow: auto; }
.dd-icon-cell {
  display: flex; align-items: center; justify-content: center; aspect-ratio: 1;
  border: 1px solid var(--dd-border); border-radius: 6px; background: var(--dd-bg); cursor: pointer; padding: 6px;
}
.dd-icon-cell:hover { border-color: var(--dd-accent); background: var(--dd-accent-soft); }
.dd-icon-cell svg { width: 100%; height: 100%; }
/* A kept icon is one of ours, and says so quietly: the grid is a grid, and a
   second visual language in it would make the two shelves read as two lists. */
.dd-icon-cell-kept { border-color: var(--dd-accent); }
/* The way out of an empty search, standing across the whole grid at the top of
   it so it reads as part of the results rather than as chrome around them. */
.dd-icon-generate {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 6px; padding: 6px 8px;
  border: 1px dashed var(--dd-accent); border-radius: 6px;
  background: var(--dd-accent-soft); color: var(--dd-accent);
  font: inherit; font-size: 12px; font-weight: 600; text-align: left; cursor: pointer;
}
.dd-icon-generate:hover { background: var(--dd-bg); }
.dd-icon-generate-glyph { display: flex; flex: 0 0 16px; }
.dd-icon-generate-glyph svg { width: 16px; height: 16px; }
.dd-icon-generate-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* A full-width row under the shapes in their flyout: the flyout lays its
   buttons out in a wrapping row, and a line of text in that row would read as
   one more square. */
.dd-popover-link {
  flex: 1 0 100%;
  padding: 4px 6px; margin-top: 2px; border: 0; border-top: 1px solid var(--dd-border);
  background: none; color: var(--dd-accent);
  font: inherit; font-size: 12px; font-weight: 600; text-align: left; cursor: pointer;
}
.dd-popover-link:hover { text-decoration: underline; }

/* ---------- the generated-icon dialog ---------- */
/* A modal rather than a popover, because it is the one place in the app where
   you wait for something: a click anywhere else must not throw a generation
   away by accident. Pinned to .dd-root, like the note sheet, so it covers the
   whole app rather than only the canvas. */
.dd-modal {
  position: absolute; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(15, 23, 42, .45);
}
.dd-modal-panel {
  display: flex; flex-direction: column; gap: 8px;
  width: min(320px, 100%); max-height: 100%; overflow: auto; padding: 12px;
  background: var(--dd-bg); border: 1px solid var(--dd-border-strong);
  border-radius: var(--dd-radius); box-shadow: var(--dd-shadow);
}
.dd-modal-title { font-size: 13px; font-weight: 600; color: var(--dd-text); }
.dd-modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
/* The one setting that belongs to a single export format, so it is shown and
   hidden with that format rather than sitting there meaning nothing. */
.dd-export-edit { display: flex; flex-direction: column; gap: 4px; }
/* A standalone file that may be edited says so with the one button that is not
   in the burger: saving is the point of that copy, not one more thing in a menu. */
.dd-save { flex: 0 0 auto; }
/* Square and generous: an icon is judged at the size it will be looked at, and
   a 44-pixel preview of one is a decision nobody can make. */
.dd-icon-preview {
  display: flex; align-items: center; justify-content: center;
  height: 140px; padding: 16px; color: var(--dd-text);
  border: 1px solid var(--dd-border); border-radius: 6px; background: var(--dd-bg);
}
.dd-icon-preview svg { width: 100%; height: 100%; }
/* The two questions only an uploaded file raises: what its licence asks to be
   said about it, and whether it may go on a shelf everybody reads. */
.dd-upload-fields { display: flex; flex-direction: column; gap: 6px; }
.dd-check {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--dd-text); cursor: pointer;
}
.dd-check input { margin: 0; accent-color: var(--dd-accent); }
.dd-attribution { font-size: 11px; color: var(--dd-muted); padding: 0 4px; }
/* Indeterminate on purpose: nothing here knows how far along a generation is,
   and a bar that pretends to would be a lie told sixty times a second. */
.dd-progress { height: 4px; overflow: hidden; border-radius: 999px; background: var(--dd-border); }
.dd-progress-bar {
  width: 40%; height: 100%; border-radius: 999px; background: var(--dd-accent);
  animation: dd-progress-slide 1.2s ease-in-out infinite;
}
@keyframes dd-progress-slide {
  from { transform: translateX(-100%); }
  to { transform: translateX(250%); }
}
@media (prefers-reduced-motion: reduce) {
  .dd-progress-bar { animation: none; width: 100%; opacity: .6; }
}

/* ---------- the standalone file's burger menu ---------- */
/* One column of full-width items, so the menu reads as a list rather than as
   the wrapped row of buttons a plain popover lays out. */
.dd-menu { width: 240px; gap: 2px; }
.dd-menu-item { justify-content: flex-start; width: 100%; border-color: transparent; }
.dd-menu-item:hover:not(:disabled) { border-color: var(--dd-border); }
.dd-menu-heading {
  padding: 8px 4px 2px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--dd-muted);
  border-top: 1px solid var(--dd-border); margin-top: 4px;
}
.dd-menu-heading:first-child { border-top: 0; margin-top: 0; }
.dd-menu-themes { width: 100%; }
.dd-menu-themes .dd-btn { flex: 1; }
/* The way out to the site, so it is the one item that does not look like a
   command performed on the file in front of you. */
.dd-menu-home { justify-content: space-between; text-decoration: none; color: var(--dd-accent); }
.dd-link { color: var(--dd-accent); }

.dd-status { font-size: 12px; color: var(--dd-muted); padding: 2px 4px; }
.dd-error { color: var(--dd-danger); }
.dd-sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

<script>
(function () {
  var raw = JSON.parse(document.getElementById('dd-document').textContent);
  // Through the same reader an import goes through, so a file whose document
  // was written terse — every default left out — opens here too, and one this
  // page wrote itself is unchanged by it.
  var doc = DeepDraw.normalizeDocument(raw) || raw;
  // Beside the document rather than in it: where the drawing came from, and
  // whether whoever exported it meant this copy to be changed.
  var origin = DeepDraw.readOrigin(raw);
  var editable = raw.allowEdit === true;
  var app = DeepDraw.mount(document.getElementById('app'), {
    document: doc,
    mode: editable ? 'edit' : 'view',
    readOnly: !editable,
    origin: origin || undefined,
    allowEdit: editable
  });
  // The menu's light/dark/device choice is the whole page's, not just the
  // app's: the attribution in the corner is outside it and would otherwise
  // stay light on a dark page.
  app.onThemeChange = function (theme) {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', theme);
  };
  // Export to HTML from inside a standalone file has no external script to
  // fetch the bundle from: the bundle is right here, inline. Hand it over, or
  // the menu writes a page with a comment where the library should be.
  app.librarySource = document.getElementById('dd-library').textContent;
  // An editable copy gets a Save button that writes this very file back to the
  // disk it was opened from. Everything that makes that possible — or says why
  // it is not — is inside the library; this page only asks for it.
  if (editable) app.enableLocalSave();
})();
</script>
